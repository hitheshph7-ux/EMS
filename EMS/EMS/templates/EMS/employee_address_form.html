
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background: #1769aa;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
        }

        .errorlist {
            color: red;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>{{ page_title }}</h2>

    <p>
        Employee: <strong>{{ employee.full_name }}</strong>
    </p>

    <p>
        CEN: <strong>{{ employee.cen }}</strong>
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Address</button>

        <a href="{% url 'EMS:employee_detail' employee.id %}">
            Cancel
        </a>
    </form>

</div>

</body>
</html>
